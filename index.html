    function decodeWmo(code) {
      if (code === 0) return { icon: '☀️', text: '晴朗' };
      if ([1, 2].includes(code)) return { icon: '⛅', text: '多雲' };
      if (code === 3) return { icon: '☁️', text: '陰天' };
      if ([45, 48].includes(code)) return { icon: '🌫️', text: '有霧' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: '🌧️', text: '短暫雨' };
      if ([71, 73, 75, 85, 86].includes(code)) return { icon: '❄️', text: '降雪' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: '雷雨' };
      return { icon: '🌤️', text: '晴時多雲' };
    }

    async function loadLocalWeather(lat, lon, label) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=precipitation_probability&timezone=auto`;
        const res = await fetch(url);
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;
        const precipProb = data.hourly?.precipitation_probability ? data.hourly.precipitation_probability[0] : 0;
        const info = decodeWmo(code);
        
        document.getElementById('local-weather-text').innerHTML = `
          <span>${info.icon} ${temp}°C</span>
          <span class="text-[9px] opacity-80">💧${precipProb}%</span>
        `;
      } catch (e) {
        document.getElementById('local-weather-text').innerText = '26°C ⛅';
      }
    }

    async function updateDestinationHourlyWeather(cityKey) {
      const city = CITY_COORDS[cityKey] || CITY_COORDS.osaka;
      
      document.getElementById('dest-board-city').innerText = `${city.name}・氣象`;
      document.getElementById('dest-board-badge').innerText = cityKey === 'kyoto' ? '京都' : '大阪';
      
      if (weatherCache[cityKey]) {
        renderHourlyBoard(weatherCache[cityKey]);
        return;
      }

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,apparent_temperature,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&timezone=Asia%2FTokyo&forecast_days=2`;
        const res = await fetch(url);
        const data = await res.json();

        const hourlyList = [];
        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const pops = data.hourly.precipitation_probability;
        const codes = data.hourly.weather_code;

        const currentIso = data.current.time;
        let startIndex = times.findIndex(t => t >= currentIso);
        if (startIndex === -1) startIndex = 0;

        for (let i = startIndex; i < startIndex + 20 && i < times.length; i++) {
          const hourStr = times[i].substring(11, 16);
          hourlyList.push({
            time: i === startIndex ? '現在' : hourStr,
            temp: Math.round(temps[i]),
            pop: pops[i] ?? 0,
            code: codes[i]
          });
        }

        const payload = {
          currentTemp: Math.round(data.current.temperature_2m),
          apparentTemp: Math.round(data.current.apparent_temperature),
          currentCode: data.current.weather_code,
          currentPop: pops[startIndex] ?? 0,
          hourlyList: hourlyList
        };

        weatherCache[cityKey] = payload;
        renderHourlyBoard(payload);

      } catch (e) {
        document.getElementById('dest-board-summary').innerText = '顯示預設天氣';
      }
    }

    function renderHourlyBoard(wData) {
      const currentInfo = decodeWmo(wData.currentCode);
      document.getElementById('dest-current-temp').innerText = `${wData.currentTemp}°C`;
      document.getElementById('dest-current-pop').innerText = `💧 ${wData.currentPop}%`;
      document.getElementById('dest-board-summary').innerText = `${currentInfo.icon} ${currentInfo.text} · 體感 ${wData.apparentTemp}°C`;

      const container = document.getElementById('hourly-forecast-container');
      let html = '';

      wData.hourlyList.forEach((h, index) => {
        const info = decodeWmo(h.code);
        const isCurrent = index === 0;

        html += `
          <div class="shrink-0 w-[50px] p-2 flex flex-col items-center justify-between border ${
            isCurrent 
              ? 'bg-pudding-light border-yellow-300/80 font-bold text-cocoa shadow-2xs' 
              : 'bg-white/60 border-white/90 text-cocoa'
          } rounded-2xl">
            <span class="text-[9px] ${isCurrent ? 'font-black' : 'text-gray-400'}">${h.time}</span>
            <span class="text-sm my-0.5">${info.icon}</span>
            <span class="text-[10px] font-black">${h.temp}°</span>
            <span class="text-[8px] text-pochacco-dark font-medium">💧${h.pop}%</span>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function initGeolocationAndWeather() {
      try {
        const ipRes = await fetch('https://ipapi.co/json/');
        if (ipRes.ok) {
          const ipData = await ipRes.json();
          if (ipData.latitude && ipData.longitude) {
            userLocation = {
              lat: ipData.latitude,
              lon: ipData.longitude,
              city: ipData.city || '目前'
            };
          }
        }
      } catch (e) {}

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation.lat = pos.coords.latitude;
            userLocation.lon = pos.coords.longitude;
            loadLocalWeather(userLocation.lat, userLocation.lon, '所在處');
          },
          () => {
            loadLocalWeather(userLocation.lat, userLocation.lon, userLocation.city || '目前');
          },
          { timeout: 4000 }
        );
      } else {
        loadLocalWeather(userLocation.lat, userLocation.lon, userLocation.city || '目前');
      }

      updateDestinationHourlyWeather('osaka');
    }

    // 導航 URL (僅帶入目的地)
    function getMapNavUrl(destinationQuery) {
      const destEncoded = encodeURIComponent(destinationQuery);
      return `https://www.google.com/maps/search/?api=1&query=${destEncoded}`;
    }

    // ==========================================
    // 3. Tab 切換與雙欄時間軸渲染
    // ==========================================
    function switchTab(tabKey) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('tab-active');
        btn.classList.add('bg-white/70', 'text-cocoa');
      });
      const activeBtn = document.getElementById(`tab-btn-${tabKey}`);
      if (activeBtn) {
        activeBtn.classList.add('tab-active');
        activeBtn.classList.remove('bg-white/70', 'text-cocoa');
      }

      const curData = tripData[tabKey];
      const currentCityKey = curData?.cityKey || 'osaka';
      updateDestinationHourlyWeather(currentCityKey);

      const container = document.getElementById('content-container');
      container.innerHTML = '';
      renderDayTimelineTab(container, tripData[tabKey]);
    }

            <div class="shrink-0 w-3.5 h-3.5 rounded-full border-2 ${nodeColor} shadow-2xs mt-3 bg-white"></div>

              <div class="flex items-start justify-between gap-1.5">
                <div class="flex-1">
                  <div class="flex items-center gap-1 mb-1.5 flex-wrap">
                    <span class="text-[8.5px] font-black px-2 py-0.5 rounded-full ${badgeBg}">${badgeText}</span>
                    
                    <!-- 營業時間標籤 -->

                      <span class="text-[8.5px] font-medium px-2 py-0.5 rounded-full bg-white/70 text-cocoa-soft border border-white">

                      </span>

                    ${item.duration ? `
                      <span class="text-[8.5px] font-medium px-2 py-0.5 rounded-full bg-white/70 text-gray-500 border border-white">
                        ⏱ ${item.duration}

                    ` : ''}
                  </div>
                  
                  <h3 class="font-black text-cocoa text-xs leading-snug flex items-center gap-1">
                    <span>${item.name}</span>
                    ${isClickable ? '<i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-teal-600"></i>' : ''}
                  </h3>
                </div>

                <!-- 微型圓形導航按鈕 -->
                <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation();" title="導航前往 ${navQuery}" class="shrink-0 w-7 h-7 rounded-full bg-blue-50/80 hover:bg-blue-100 border border-blue-200/60 flex items-center justify-center text-blue-600 shadow-2xs transition active:scale-90">
                  <i class="fa-solid fa-location-arrow text-[10px]"></i>

    // ==========================================
    // 4. 通用 Modal 控制
    // ==========================================
    function openDynamicModal(cityKey, itemIndex) {
      let activeTabKey = 'day1';
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.classList.contains('tab-active')) {
          activeTabKey = btn.id.replace('tab-btn-', '');
        }
      });

      const item = tripData[activeTabKey]?.items[itemIndex];
      if (!item || !item.modalData) return;

      const m = item.modalData;
      document.getElementById('dynamic-modal-icon').innerText = m.icon || '📍';
      document.getElementById('dynamic-modal-title').innerText = m.title || '詳細資訊';

      let bodyHtml = '';

      // A. 景點歷史故事與特色亮點摘要 (清水寺 / 伏見稻荷 / 八坂神社 / 難波八阪神社)
      if (m.type === 'spotDetail' && m.spot) {
        const s = m.spot;
        bodyHtml += `
          <div class="space-y-3">
            <div class="p-3 bg-pudding-light/80 rounded-2xl border border-yellow-200/80 text-center">
              <h4 class="font-black text-cocoa text-sm">${s.name}</h4>
              <span class="inline-block text-[10px] font-bold text-amber-900 bg-white/90 px-2.5 py-0.5 rounded-full border border-yellow-200 mt-1">${s.status}</span>
              <p class="text-[11px] text-gray-700 leading-relaxed mt-2 text-left">${s.history}</p>

            <div class="space-y-2">
              <div class="text-[11px] font-black text-cocoa flex items-center gap-1">
                <span>✨</span> 核心必看特色與傳奇
              </div>
        `;

          bodyHtml += `

              <div class="font-bold text-cocoa text-xs mb-0.5 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-pochacco-dark"></span>
                <span>${h.label}</span>
              </div>
              <p class="text-[11px] text-gray-600 leading-relaxed pl-3">${h.text}</p>
            </div>
          `;
        });
        bodyHtml += `
            </div>
            ${s.ticketInfo ? `
              <div class="p-2.5 bg-gray-50/80 rounded-xl border border-gray-150 text-[10.5px] text-cocoa-soft leading-snug">
                📌 <b>參拜實用資訊：</b>${s.ticketInfo}

            ` : ''}

        `;

      // B. 條例式交通轉乘步驟

        bodyHtml += `<div class="space-y-2">`;
        m.steps.forEach(s => {

            <div class="p-3 bg-white/80 rounded-2xl border border-gray-150 shadow-2xs">
              <div class="flex items-center gap-2 mb-1">
                <span class="w-5 h-5 rounded-full bg-teal-100 text-teal-900 font-black text-[10px] flex items-center justify-center shrink-0">${s.step}</span>

              </div>
              <p class="text-[11px] text-gray-600 leading-relaxed pl-7 whitespace-pre-line">${s.desc}</p>

        bodyHtml += `</div>`;

        });
        bodyHtml += `</div>`;

                <div class="text-sm font-black text-cocoa tracking-wide text-center">${it.jp}</div>

          bodyHtml += `</div></div>`;
        });
        bodyHtml += `</div>`;

      document.getElementById('dynamic-modal-body').innerHTML = bodyHtml;
      document.getElementById('dynamic-modal').classList.remove('hidden');
    }

    function closeDynamicModal() {
      document.getElementById('dynamic-modal').classList.add('hidden');
    }

    // 渲染清單 Modal
    function renderPrepModalContent() {
      const data = tripData.prep;
      let html = '';

      data.categories.forEach(cat => {
        let borderColor = 'border-white/80';
        let iconBg = 'bg-pudding text-cocoa';

        if (cat.color === 'teal') {
          borderColor = 'border-pochacco/40';
          iconBg = 'bg-pochacco text-teal-900';
        } else if (cat.color === 'blue') {
          borderColor = 'border-blue-200/50';
          iconBg = 'bg-blue-100 text-blue-900';
        } else if (cat.color === 'red') {
          borderColor = 'border-red-200/50';
          iconBg = 'bg-red-100 text-red-800';
        }

        html += `
          <div class="bg-white/70 backdrop-blur-md p-3 rounded-2xl border ${borderColor} shadow-2xs">
            <div class="flex items-center gap-1.5 mb-2">
              <div class="w-5 h-5 rounded-full ${iconBg} flex items-center justify-center text-[10px] shadow-2xs">
                <i class="fa-solid ${cat.icon}"></i>
              </div>
              <h3 class="font-bold text-xs text-cocoa flex items-center gap-1">
                <span>${cat.name}</span>
                ${PochaccoHeadSvg}
              </h3>
            </div>
            <div class="grid grid-cols-1 gap-1">
        `;

        cat.items.forEach((item) => {
          html += `
            <label class="flex items-start gap-2 p-1.5 rounded-xl hover:bg-white/60 text-xs text-cocoa/90 cursor-pointer transition">
              <input type="checkbox" class="mt-0.5 w-3.5 h-3.5 rounded text-cocoa focus:ring-pudding border-gray-300">
              <span class="leading-snug">${item}</span>
            </label>
          `;
        });

        html += `</div></div>`;
      });

      document.getElementById('prep-modal-content').innerHTML = html;
    }

    function openPrepModal() {
      renderPrepModalContent();
      document.getElementById('prep-modal').classList.remove('hidden');
    }

    function closePrepModal() {
      document.getElementById('prep-modal').classList.add('hidden');
    }

    window.addEventListener('click', (e) => {
      const dynamicModal = document.getElementById('dynamic-modal');
      const prepModal = document.getElementById('prep-modal');
      if (e.target === dynamicModal) closeDynamicModal();
      if (e.target === prepModal) closePrepModal();
    });

    // 初始化執行 (預設 Day 1)
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('day1');
      initGeolocationAndWeather();
    });
  </script>
</body>
